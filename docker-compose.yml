services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cabortho
      POSTGRES_PASSWORD: cabortho
      POSTGRES_DB: cabortho
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d

  api:
    build:
      context: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://cabortho:cabortho@db:5432/cabortho
      JWT_SECRET: change-this-secret
      JWT_EXPIRES_IN: 8h
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      - db

  frontend:
    build:
      context: .
    environment:
      VITE_API_BASE_URL: http://localhost:4000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
